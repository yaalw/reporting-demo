<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solvara Insights · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #2b2a28; --muted: #6b6a66; --faint: #a3a19c; --line: #eae8e3; --line2: #f1efeb;
    --accent: #e0712c; --accent-soft: #fdeee3; --accent-mid: #f3b48b; --comp: #3b8ed6; --comp-soft: #e6f1fb; --comp-mid: #a3c9ec; --good: #2f8a5b; --bad: #b8392e; --warn: #a86a0b;
    --shadow: 0 1px 2px rgba(43, 42, 40, .04), 0 10px 28px -14px rgba(43, 42, 40, .12);
    --font: 'Mulish', system-ui, -apple-system, sans-serif; --serif: 'Mulish', system-ui, sans-serif; --mono: 'DM Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  select, input { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: 12px; background: var(--line2); padding: 1px 6px; border-radius: 5px; }

  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100vh; }
  .app.copilot-open { grid-template-columns: 250px minmax(0, 1fr) 380px; }

  /* Sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 26px 18px 18px; display: flex; flex-direction: column; overflow: auto; }
  .brand { padding: 0 10px 22px; }
  .brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; display: block; line-height: 1.1; }
  .brand b span { color: var(--accent); }
  .brand small { color: var(--muted); font-size: 13px; }
  .sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 16px 10px 8px; font-weight: 600; }
  .nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: none; background: none; padding: 9px 12px; border-radius: 9px; color: var(--ink); font-size: 14.5px; font-weight: 500; }
  .nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); flex: none; }
  .nav:hover { background: var(--bg); }
  .nav.active { background: var(--accent-soft); color: var(--accent); } .nav.active svg { color: var(--accent); }
  .nav[disabled] { opacity: .4; cursor: not-allowed; }
  .side .foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .side .foot .live { display: flex; align-items: center; gap: 7px; } .side .foot .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .rolebox { margin: 10px 0 12px; display: flex; flex-direction: column; gap: 6px; }
  .rolebox label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .rolebox .ms { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5px; } .rolebox .ms i { width: 5px; height: 5px; display: block; }
  .dd.role { width: 100%; justify-content: space-between; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; box-shadow: none; }

  /* Main */
  .main { overflow: auto; padding: 34px 40px 80px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
  .page-head h1 { font-size: 36px; font-weight: 800; margin: 0 0 2px; letter-spacing: -0.015em; line-height: 1.1; color: var(--accent); }
  .page-head p { margin: 0; color: var(--muted); font-size: 18px; font-weight: 300; }
  .page-head .right { display: flex; align-items: center; gap: 10px; flex: none; margin-top: 6px; }
  .pill { background: var(--comp-soft); color: #2a6ea8; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }
  .btn:hover { border-color: var(--accent-mid); color: var(--accent); }
  .btn:active { transform: translateY(1px); }

  /* Controls */
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
  .dd { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 14px 9px 16px; font-size: 14px; font-weight: 500; color: var(--ink); box-shadow: var(--shadow); transition: border-color .15s, background .15s; }
  .dd:hover, .dd.open { border-color: var(--accent-mid); }
  .dd.on { background: var(--accent-soft); border-color: transparent; color: #a24d12; }
  .dd b { font-weight: 700; } .dd i { font-style: normal; color: var(--faint); font-weight: 400; margin-left: 8px; }
  .dd svg { width: 10px; height: 6px; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: .7; transition: transform .15s; } .dd.open svg { transform: rotate(180deg); }
  .filters .clear { border: none; background: none; color: var(--muted); font-size: 13.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .filters .scope { margin-left: auto; font-size: 13px; color: var(--muted); }
  .pop { position: fixed; z-index: 30; background: var(--panel); border-radius: 14px; box-shadow: 0 2px 4px rgba(43,42,40,.06), 0 18px 44px -12px rgba(43,42,40,.28); border: 1px solid var(--line); min-width: 240px; animation: popin .14s ease-out; }
  @keyframes popin { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
  .pop .list { padding: 6px; max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .pop .search { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 2px 2px 6px; border-bottom: 1px solid var(--line); }
  .pop .search svg { width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .pop .search input { border: none; outline: none; background: none; flex: 1; font-size: 14px; padding: 4px 0; }
  .pop .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: none; background: none; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-weight: 500; }
  .pop .opt:hover { background: var(--bg); } .pop .opt.on { background: var(--accent-soft); color: #a24d12; }
  .pop .opt small { color: var(--faint); font-weight: 400; font-size: 12.5px; }
  .pop .none { padding: 12px; color: var(--faint); font-size: 13px; text-align: center; }
  .pop .cal { display: grid; grid-template-columns: 180px 1fr; }
  .pop .presets { border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 1px; }
  .pop .presets button { border: none; background: none; text-align: left; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-weight: 500; }
  .pop .presets button:hover { background: var(--bg); } .pop .presets button.on { background: var(--accent-soft); color: #a24d12; }
  .pop .months { padding: 14px 16px 12px; min-width: 420px; }
  .pop .calhint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .pop .yrow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pop .yr { width: 40px; font-size: 12.5px; color: var(--faint); font-weight: 600; }
  .pop .mgrid { display: flex; gap: 3px; flex: 1; }
  .pop .m { border: none; background: var(--bg); border-radius: 8px; padding: 8px 0; width: 46px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .pop .m:hover { background: var(--accent-soft); color: #a24d12; }
  .pop .m.in { background: var(--accent-soft); color: #a24d12; } .pop .m.start, .pop .m.end { background: var(--accent); color: white; }
  .pop .m.now { box-shadow: inset 0 0 0 1.5px var(--accent-mid); }
  .pop .calfoot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-size: 12.5px; color: var(--muted); } .pop .calfoot b { color: var(--ink); font-weight: 600; }

  /* Sections */
  .section { margin-bottom: 30px; }
  .stitle { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .stitle h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .stitle span { color: var(--muted); font-size: 14px; font-weight: 300; }
  .card { background: var(--panel); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow); min-width: 0; }
  .cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .cardhead h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .cardhead .sub { color: var(--muted); font-size: 13.5px; }
  .cardhead .hint { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
  .chart { position: relative; height: 260px; }
  .chart.hero { height: 340px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
  .kpi .lbl { color: var(--muted); font-size: 14px; font-weight: 500; }
  .kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .d { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .d.pos { color: var(--good); } .kpi .d.neg { color: var(--bad); } .kpi .d.dim { color: var(--faint); font-weight: 500; }
  .kpi .cmp { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line2); font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.drillrow { cursor: pointer; } tr.drillrow:hover td { background: #fbf8f4; }
  tr.drillrow td:first-child { font-weight: 500; }
  .bar { height: 6px; border-radius: 3px; background: var(--comp-mid); display: inline-block; vertical-align: middle; margin-left: 10px; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .dim { color: var(--faint); }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line2); color: var(--muted); font-weight: 500; white-space: nowrap; }
  .tag.bad { background: #f9e9e7; color: var(--bad); } .tag.good { background: var(--comp-soft); color: #2a6ea8; } .tag.warn { background: var(--comp-soft); color: var(--warn); }
  .dims { display: flex; gap: 2px; background: var(--bg); border-radius: 999px; padding: 3px; }
  .dims button { border: none; background: none; padding: 5px 12px; font-size: 13.5px; color: var(--muted); border-radius: 999px; font-weight: 500; }
  .dims button:hover { color: var(--ink); } .dims button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  /* Funnel */
  .funnel { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .frow { display: grid; grid-template-columns: 72px minmax(0,1fr) 52px 96px; align-items: center; gap: 12px; font-size: 14px; }
  .frow .fb { height: 24px; border-radius: 5px; background: var(--comp-mid); min-width: 3px; } .frow:last-child .fb { background: var(--comp); }
  .frow .n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .frow .cv { font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Regio tiles */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 60px); gap: 5px; }
  .tile { border-radius: 8px; padding: 8px 10px; color: white; font-size: 11.5px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
  .tile:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .tile b { font-size: 12px; display: block; line-height: 1.2; font-weight: 600; } .tile small { opacity: .85; }
  .legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  details.records summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.records summary::before { content: '›'; display: inline-block; transition: transform .15s; color: var(--faint); font-size: 18px; line-height: 1; } details.records[open] summary::before { transform: rotate(90deg); }
  .recs { font-size: 13px; } .recs td, .recs th { padding: 7px 10px; white-space: nowrap; } .mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* CoPilot */
  .copilot[hidden] { display: none; }
  .copilot { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .copilot .head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px; }
  .copilot .head b { display: block; font-size: 20px; font-weight: 800; color: var(--accent); } .copilot .head small { color: var(--muted); font-size: 13px; }
  .copilot .head .close { margin-left: auto; border: none; background: none; color: var(--muted); font-size: 20px; }
  .msgs { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 94%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--comp); color: white; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul { margin: 4px 0 8px; padding-left: 18px; } .msg.bot li { margin: 2px 0; }
  .msg.bot .src { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; font-family: var(--mono); }
  .msg.bot .src b { font-weight: 500; color: var(--accent); }
  .msg.bot .mini { height: 130px; margin: 8px 0; }
  .msg.bot .deny { color: var(--bad); font-weight: 600; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; } .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  .chips { padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .qchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; text-align: left; }
  .qchip:hover { border-color: var(--accent-mid); color: var(--accent); background: var(--accent-soft); }
  .ask { display: flex; gap: 8px; padding: 12px 20px 20px; border-top: 1px solid var(--line); }
  .ask input { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; }
  .ask input:focus { outline: none; border-color: var(--accent-mid); }
  .ask button { background: var(--comp); color: white; border: none; border-radius: 999px; padding: 0 16px; font-weight: 600; }

  .arch { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .arch .node { background: var(--bg); border-radius: 12px; padding: 14px; font-size: 13px; position: relative; color: var(--muted); }
  .arch .node b { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink); font-weight: 600; }
  .arch .node:not(:last-child)::after { content: '→'; position: absolute; right: -12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 14px; }
  .hint { font-size: 13.5px; color: var(--muted); }

  @media (max-width: 1150px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .app.copilot-open { grid-template-columns: 250px minmax(0,1fr); } .copilot { position: fixed; inset: 0; z-index: 5; } }
  @media (max-width: 800px) { .app, .app.copilot-open { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .side { flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 12px; } .side .sec, .side .foot, .brand small { display: none; } .rolebox { margin: 0; } .main { padding: 20px 16px 60px; } .page-head { flex-direction: column; } .filters .scope { display: none; } }

  /* Periode-keuze */
  .stitle .sright { margin-left: auto; }
  .pc { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .pc > button, .pc .custom > button { border: none; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pc > button:hover, .pc .custom > button:hover { color: var(--ink); background: var(--bg); }
  .pc > button.on, .pc .custom > button.on { background: var(--accent); color: white; }
  .pc .custom { position: relative; }
  .pc .custom svg { width: 9px; height: 5px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .calpop { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 25; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 4px rgba(43,42,40,.06), 0 18px 44px -12px rgba(43,42,40,.28); padding: 12px 14px 14px; }
  .pc .custom:hover .calpop, .pc .custom.pin .calpop { display: block; }
  .calpop::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
  .calhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .calhead button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; width: 26px; height: 26px; font-size: 16px; line-height: 1; color: var(--ink); }
  .calhead button:disabled { opacity: .3; cursor: default; }
  .cals { display: flex; gap: 18px; }
  .cm { width: 224px; }
  .cmh { font-size: 13px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .cg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cg span { font-size: 10.5px; color: var(--faint); text-align: center; padding: 3px 0; font-weight: 600; }
  .day { border: none; background: transparent; border-radius: 8px; height: 30px; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .day:hover:not(:disabled) { background: var(--accent-soft); }
  .day.out { opacity: .35; } .day:disabled { color: var(--faint); cursor: default; opacity: .4; }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent-mid); }
  .day.in { background: var(--accent-soft); border-radius: 0; } .day.start, .day.end { background: var(--accent); color: white; border-radius: 8px; }
  .day.start { border-radius: 8px 0 0 8px; } .day.end { border-radius: 0 8px 8px 0; } .day.start.end { border-radius: 8px; }

  /* Grafiek-toggles en drill-scope */
  .toggles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .seg { display: inline-flex; align-items: center; gap: 2px; background: var(--bg); border-radius: 999px; padding: 3px; }
  .seg .segl { font-size: 12px; color: var(--faint); padding: 0 8px 0 10px; font-weight: 600; }
  .seg button { border: none; background: none; padding: 5px 12px; font-size: 13px; color: var(--muted); border-radius: 999px; font-weight: 600; }
  .seg button:hover { color: var(--ink); } .seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .scopepill { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); color: #a24d12; border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 13px; font-weight: 600; }
  .scopepill button { border: none; background: rgba(162,77,18,.12); color: #a24d12; border-radius: 50%; width: 18px; height: 18px; font-size: 13px; line-height: 1; display: grid; place-items: center; padding: 0; }
  .scopepill button:hover { background: rgba(162,77,18,.25); }
  .flag { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .flag:hover { color: var(--ink); } .flag.on { background: var(--comp-soft); color: #2a6ea8; border-color: transparent; }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--faint); margin-bottom: 8px; }
  .lnk { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent-mid); text-underline-offset: 3px; cursor: pointer; }
